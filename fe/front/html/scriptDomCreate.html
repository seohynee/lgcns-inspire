<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="../css/create.css" rel="stylesheet">
</head>
<body>
    <h2>사용자 목록</h2>

    <div class="container" id="container">

    </div>

    <script>
        ary = []; // local이 아닌 global로 두어 loadData, makeCard에서 모두 사용 가능
        const loadData = async () => {
            await fetch('https://jsonplaceholder.typicode.com/users') // fetch : data 가져옴
                .then( response => response.json())
                .then( data => {
                    console.log(`debug >>>> data`, data);
                    ary = data; // makeCard(data); 로도 쓰일 수 있음
                })
                .catch( error => {
                    console.log(`debug >>>> error, ${error}`);
                });
        }

        const makeCard = (e) => {

            container.innerHTML = '';
            ary.forEach( (object, idx) => {
                const card = document.createElement('div'); // div 형태의 card 생성
                card.className = 'card';

                const name = document.createElement('h3'); 
                name.textContent = object.username;
                const major = document.createElement('p');
                major.textContent = object.email;
                const phone = document.createElement('p');
                phone.textContent = object.address?.city??'seoul';


                // 삭제 button
                const delBtn = document.createElement('button');
                delBtn.className = 'btn'
                delBtn.textContent = '삭제';

                delBtn.onclick = (e) => {
                    window.alert('button click');
                    ary.splice(idx, 1); // idx번째 위치부터 시작해서, 1개의 요소를 제거 (splice)
                    makeCard();
                }

                card.appendChild(name);
                card.appendChild(major);
                card.appendChild(phone);
                card.appendChild(delBtn);


                container.appendChild(card); // card에 name, major, phone 정보 추가후 card를 container에 불러옴
             });
        }

        const init = async() => {
            await loadData();
            makeCard();
        }
        init();
    </script>
</body>
</html>
