<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- user define script-->
     <script src = "../script/greeting.js"></script>

</head>
    <body>
        <form action="/server-destination"> 
            <div class="mb-3 mt-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password:</label>
                <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
            </div>
            <div class="form-check mb-3">
                <label class="form-check-label">
                <input class="form-check-input" type="checkbox" name="remember"> Remember me
                </label>
            </div>
            <button type="button" class="btn btn-warning" id="submit">Submit</button>
        </form>

        <script>
            document.querySelector("#submit").onclick = function() {
                window.alert(">>> submit button click");
                let email = document.querySelector("#email").value; <!-- #을 쓰면 해당 id 요소를 선택 -->
                let pwd = document.querySelector("#pwd").value;
                console.log('debug >>>>> ${email}'); 
                console.log('debug >>>>> ${pwd}');
                console.log("debug >>>>> ", pwd);
            }
        </script>

    </body>
</html>
