<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Script</title>
    </head>

    <body>
        <script>
            /*
            script(interpriter)
            변수 - 데이터를 담는 그릇
            - 변수의 타입이 존재하지 않는다 (es6, var, let, const) (type scirpt)
            - 실행시점(변수의 값이 할당되는 시점)
            - 기본타입(숫자, 문자(열), 논리, null, undefined)
            - 참조타입(Object, Array, Function, etc...) -> object type
            - 흐름제어구문, 반복구문
            - 함수(Function)
            */
           var message = "script";
           console.log(`dedug >>>> message = ${message}`); //template string (백틱을 이용한 문법)
           console.log(`debug >>>> message type ${typeof message}`);

           message = 10;
           console.log(`dedug >>>> message = ${message}`);
           console.log(`debug >>>> message type ${typeof message}`);
           console.log(`debug >>>> message == ${message == "10"}`);

           let msg = "let 키워드를 이용하면 중복 변수 선언을 방지할 수 있습니다.";
           // let msg = 10; -> 재선언하면 에러 발생

           const num = 10; // 상수 : 값 재할당 불가
           num = 20;

            console.log(`debug >>>> 스크립트에서 가장 많이 사용하는 변수의 타입 - Object`);
            console.log(`debug >>>> scipt object === json(rest api {key:value})`)
            let obj = {
                //key : value,
                name : 'shlee',
                age : 20,
                major : "cs"
            };
            console.log("debug >>>> obj value", obj);
            console.log("debug >>>> obj type", typeof obj);
            console.log("debug >>>> obj property", obj.major);
            console.log("debug >>>> obj property", obj['major']);

            console.log(`debug >>>> 스크립트 객체를 담는 변수의 타입 [] - Array`);
            let ary = [
                {name: "inspire"},
                {name : "lg cns"},
                {name : "am"},
                {name : "came6th"}
            ];

            console.log("debug >>>> array value", ary);
            console.log(`debug >>>> array type`, typeof ary);
            console.log("debug >>>> array index", ary[0].name);
            console.log(`debug >>>> array index" ${ary[0].name}`); //template string 이용
            //console.log("debug >>>> obj property", obj.major);
            console.log("debug >>>> array function, map(), filter(), forEach()");
            // forEach() : 반복



        </script>
    </body>
</html>
